<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bubble Shooter Classic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2300d4ff' opacity='0.8'/><circle cx='38' cy='38' r='12' fill='white' opacity='0.5'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="game-wrapper">
  <svg id="stars" xmlns="http://www.w3.org/2000/svg"></svg>



  <!-- Game Over Screen -->
  <div id="gameover-screen" class="overlay hidden">
    <div class="overlay-icon">
      <svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="28" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-dasharray="8 6" opacity="0.8"/><line x1="20" y1="20" x2="50" y2="50" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="20" x2="20" y2="50" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
    <div class="overlay-title" style="color:var(--accent);">GAME<br>OVER</div>
    <div class="score-display" id="final-score">0</div>
    <div id="high-score" class="overlay-sub" style="color:var(--gold);margin:0 0 8px;"></div>
    <div class="overlay-sub">Bubbles reached the bottom!</div>
    <button class="btn-play" onclick="startGame()" style="background:linear-gradient(135deg,var(--accent),var(--orange));">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="white"><path d="M2,9 A7,7 0 1,1 9,16 M9,16 L6,13 M9,16 L12,13" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      RETRY
    </button>
  </div>

  <!-- Level Clear Screen -->
  <div id="levelclear-screen" class="overlay hidden">
    <div class="overlay-icon">
      <svg width="70" height="70" viewBox="0 0 70 70"><polygon points="35,5 42,25 65,25 47,38 53,58 35,46 17,58 23,38 5,25 28,25" fill="#ffd700" stroke="#ffaa00" stroke-width="2"/></svg>
    </div>
    <div class="overlay-title" style="color:var(--gold);">LEVEL<br>CLEAR!</div>
    <div class="score-display" id="level-score">0</div>
    <div class="overlay-sub" id="level-msg">Amazing! Keep going!</div>
    <button class="btn-play" onclick="nextLevel()">
      NEXT
      <svg width="18" height="18" viewBox="0 0 20 20" fill="white"><polygon points="4,2 18,10 4,18"/></svg>
    </button>
  </div>

  <!-- Ad Prompt Screen -->
  <div id="ad-prompt-screen" class="overlay hidden">
    <div class="overlay-icon">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2" ry="2"/>
        <polygon points="10 9 15 12 10 15 10 9" fill="#ffd700"/>
      </svg>
    </div>
    <div class="overlay-title" style="font-size:32px; color:white;">OUT OF BOMBS!</div>
    <div class="overlay-sub" style="margin-bottom:24px;">Watch a short video to get 5 more bombs?</div>
    <div style="display:flex; gap:16px;">
      <button class="btn-cancel" onclick="closeAdPrompt()">CANCEL</button>
      <button class="btn-play" onclick="watchAdForBombs()" style="padding:12px 24px; font-size:16px;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="white"><polygon points="4,2 18,10 4,18"/></svg>
        WATCH AD
      </button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Level</div>
      <div class="hud-value" id="level-val">1</div>
    </div>
  </div>

  <!-- Game Canvas -->
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
    <canvas id="aim-line"></canvas>
  </div>

  <!-- Bottom -->
  <div id="bottom-area">
    <!-- Bomb button on the left -->
    <button id="bomb-btn" onclick="useBomb()" title="Bomb">
      <img src="Bomb.png" width="36" height="36" alt="Bomb">
      <span id="bomb-count" class="bomb-badge">5</span>
    </button>

    <div id="next-bubble-wrap">
      <div class="next-label">Next</div>
      <canvas id="next-canvas" width="44" height="44"></canvas>
    </div>
    <button id="swap-btn" onclick="swapBubbles()" title="Swap bubbles">
      <img src="Change.png" width="34" height="34" alt="Swap">
    </button>

  </div>
</div>

<!-- JS Modules (dependency order) -->
<script src="splay-bridge.js"></script>
<script src="js/config.js"></script>
<script src="js/sound.js"></script>
<script src="js/grid.js"></script>
<script src="js/particles.js"></script>
<script src="js/renderer.js"></script>
<script src="js/physics.js"></script>
<script src="js/input.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
